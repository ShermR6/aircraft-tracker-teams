<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #0d1117;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-app-region: drag; user-select: none; overflow: hidden;
  }
  .wrap { text-align: center; color: #fff; padding: 24px; }
  .logo { width: 76px; height: 76px; margin: 0 auto 18px; display: block; }
  .name { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
  .sub  { font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #6b7280; margin-top: 3px; }
  .status { font-size: 12.5px; color: #9ca3af; margin-top: 24px; min-height: 16px; }
  .bar  { width: 190px; height: 4px; background: #1f2937; border-radius: 2px; margin: 12px auto 0; overflow: hidden; opacity: 0; transition: opacity .2s; }
  .bar.show { opacity: 1; }
  .fill { height: 100%; width: 0%; background: #0ea5e9; border-radius: 2px; transition: width .25s ease; }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <circle cx="60" cy="60" r="40" fill="none" stroke="#ffffff" stroke-width="9" stroke-dasharray="195.4 48.9" stroke-linecap="round"/>
      <path fill="#0ea5e9" transform="translate(87.5,32.5) rotate(225) scale(1.4)" d="M0,-15 C1.8,-15 3,-11.5 3,-8 L3,-3.2 L16,3.8 L16,7.2 L3,4.2 L3,9 L7,12.2 L7,14.6 L0,12.8 L-7,14.6 L-7,12.2 L-3,9 L-3,4.2 L-16,7.2 L-16,3.8 L-3,-3.2 L-3,-8 C-3,-11.5 -1.8,-15 0,-15 Z"/>
    </svg>
    <div class="name">FinalPing for Teams</div>
    <div class="sub">Aircraft Alerts</div>
    <div class="status" id="status">Starting&hellip;</div>
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
  </div>
</body>
</html>
